<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오 스타일 BMI 계산기</title>
  </head>
  <body>

    <!-- 카카오톡 스타일 메인 컨테이너 카드 -->
    <div class="bmi-container">
      <h2>BMI 계산기</h2>
      
      <div class="input-group">
        <label for="height">키(cm)</label>
        <input type="text" id="height" placeholder="예: 170">
      </div>
      
      <div class="input-group">
        <label for="weight">몸무게(kg)</label>
        <input type="text" id="weight" placeholder="예: 70">
      </div>

      <button onclick="calculateBMI()">계산하기</button>

      <!-- 결과 출력 영역 -->
      <div class="result-box">
        <div id="result">BMI 수치가 여기에 표시됩니다</div>
        <div id="state">상태</div>
      </div>

      <!-- 이미지 및 일러스트 상태 카드 영역 -->
      <div id="imageCard" class="bmi-image-card" style="display: none;">
        <div id="bmiImg"></div>
        <p id="imageDesc" class="bmi-image-desc"></p>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
